<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2026 동계수련회</title>
  <meta name="description" content="2026 West Coast Winter Retreat · Nov 27–29">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Winter Retreat 2026">
  <meta property="og:title" content="2026 West Coast Winter Retreat">
  <meta property="og:description" content="Nov 27–29 · Schedule, rooms & contacts">
  <meta property="og:url" content="https://ilhwan-moon.github.io/2026-jbchusa-westcoast-winter-retreat/">
  <meta property="og:image" content="https://ilhwan-moon.github.io/2026-jbchusa-westcoast-winter-retreat/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#7a2e22">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="2026 Winter Retreat">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () { try { var m = localStorage.getItem('rt_theme') || ((document.cookie.match(/(?:^|;\s*)rt_theme=(light|dark|auto)/) || [])[1]); if (m !== 'auto' && m !== 'dark') m = 'light'; if (m !== 'auto') document.documentElement.setAttribute('data-theme', m); } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); } })();
  </script>
  <script src="data.js"></script>
</head>
<body>
  <a class="skip" href="#main">본문으로</a>

  <header class="topbar" id="top">
    <div class="topbar-inner">
      <div class="brand">
        <img src="icon-192.png" alt="" width="40" height="40">
        <div>
          <div class="brand-name" id="brandName"></div>
          <div class="brand-sub" id="brandSub"></div>
        </div>
      </div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Language" id="langSeg">
          <button type="button" data-lang="ko" lang="ko">한국어</button>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="es" lang="es">ES</button>
          <button type="button" data-lang="zh" lang="zh">中文</button>
        </div>
        <div class="sizeseg" role="group" id="sizeSeg">
          <button type="button" data-size="1"><span class="g g1" aria-hidden="true">가</span></button>
          <button type="button" data-size="2"><span class="g g2" aria-hidden="true">가</span></button>
          <button type="button" data-size="3"><span class="g g3" aria-hidden="true">가</span></button>
        </div>
        <button type="button" class="theme-btn" id="themeBtn"><span class="ico" id="themeIco" aria-hidden="true"></span><span class="sr" id="themeLabel"></span></button>
      </div>
    </div>
  </header>

  <div class="size-hint" id="sizeHint" hidden>
    <span id="sizeHintText"></span>
    <button type="button" id="sizeHintClose" data-i18n="ok"></button>
  </div>

  <main id="main" class="wrap">
    <!-- ① 일정 -->
    <section class="view" id="v-schedule" data-view="schedule">
      <div class="now card" id="nowCard" hidden></div>

      <div class="quick">
        <a class="quick-btn q-counsel" id="qCounsel" target="_blank" rel="noopener">
          <span class="ico" data-ico="chat"></span>
          <span class="q-txt"><b data-i18n="counselBtnShort"></b><small data-i18n="counselSub"></small></span>
        </a>
      </div>
      <section class="card sermon-quick" id="sermonQuick">
        <h2 class="eyebrow"><span class="ico" data-ico="bible"></span><span data-i18n="sermonsAt"></span></h2>
        <ol class="sq-list" id="sqList"></ol>
      </section>

      <div class="hero" id="hero">
        <img class="hero-art" src="hero.jpg" alt="" width="900" height="833">
        <div class="hero-text">
          <p class="hero-tag">A Life, Piece by Piece, to Be Like Him</p>
          <h1 class="hero-title" id="heroTitle"></h1>
          <p class="hero-theme"><span class="script">Imitating Jesus Christ</span><span class="hero-theme-t" id="heroTheme"></span></p>
          <p class="hero-date" id="heroDate"></p>
          <p class="hero-place" id="heroPlace"></p>
          <p class="hero-count" id="heroCount" hidden></p>
          <button type="button" class="video-link" id="qVideo"><span class="ico" data-ico="play"></span><span data-i18n="videoBtn"></span></button>
        </div>
      </div>


      <div class="viewseg" role="group" id="viewSeg">
        <button type="button" data-mode="day" data-i18n="viewDay"></button>
        <button type="button" data-mode="table" data-i18n="viewTable"></button>
      </div>
      <div id="dayMode">
        <div class="daytabs" role="tablist" id="dayTabs"></div>
        <h2 class="day-label" id="dayLabel"></h2>
        <ol class="sched" id="sched"></ol>
      </div>
      <div id="tableMode" hidden>
        <div class="tgrid" id="tgrid"></div>
        <p class="note" data-i18n="tableNote"></p>
      </div>
      <p class="note" id="youthNote"></p>
    </section>

    <!-- ② 말씀 · 장소 -->
    <section class="view" id="v-word" data-view="word" hidden>
      <section class="card">
        <h2 class="eyebrow"><span class="ico" data-ico="bible"></span><span data-i18n="mainSermons"></span></h2>
        <ol class="sermons" id="sermonList"></ol>
        <ul class="bullets" id="sermonNotes"></ul>
      </section>
      <section class="card">
        <h2 class="eyebrow"><span class="ico" data-ico="pin"></span><span data-i18n="places"></span></h2>
        <ol class="places" id="placeList"></ol>
        <p class="note" id="buildingNote"></p>
      </section>
      <section class="card">
        <h2 class="eyebrow"><span class="ico" data-ico="book"></span><span data-i18n="seminar"></span></h2>
        <p class="lead" data-i18n="seminarLead"></p>
        <ul class="rows" id="seminarList"></ul>
        <h3 class="sub" data-i18n="seminarTimes"></h3>
        <ul class="rows times" id="seminarTimes"></ul>
      </section>
      <section class="card">
        <h2 class="eyebrow"><span class="ico" data-ico="people"></span><span data-i18n="langFellow"></span></h2>
        <ul class="rows" id="fellowList"></ul>
      </section>
      <section class="card counsel">
        <h2 class="eyebrow"><span class="ico" data-ico="chat"></span><span data-i18n="counsel"></span></h2>
        <p id="counselText"></p>
        <a class="big-btn" id="counselBtn" target="_blank" rel="noopener"><span class="ico" data-ico="ext"></span><span data-i18n="counselBtn"></span></a>
      </section>
      <section class="card pillars">
        <h2 class="eyebrow"><span class="ico" data-ico="heart"></span><span id="themeHead"></span></h2>
        <blockquote class="theme-verse"><p id="themeVerse"></p><cite id="themeRef"></cite></blockquote>
        <div class="pillar-grid" id="pillars"></div>
      </section>
    </section>

    <!-- ③ 생활 안내 -->
    <section class="view" id="v-info" data-view="info" hidden>
      <section class="card">
        <h2 class="eyebrow"><span class="ico" data-ico="bed"></span><span data-i18n="lodging"></span></h2>
        <ul class="rows" id="lodgingList"></ul>
        <ul class="warn" id="lodgingRules"></ul>
      </section>
      <section class="card">
        <h2 class="eyebrow"><span class="ico" data-ico="bell"></span><span data-i18n="rules"></span></h2>
        <ul class="bullets rules" id="ruleList"></ul>
      </section>
      <section class="card">
        <h2 class="eyebrow"><span class="ico" data-ico="child"></span><span id="kidsTitle"></span></h2>
        <ul class="bullets rules" id="kidsList"></ul>
      </section>
      <section class="card">
        <h2 class="eyebrow"><span class="ico" data-ico="check"></span><span data-i18n="supplies"></span></h2>
        <p class="lead" data-i18n="suppliesLead"></p>
        <ul class="checks" id="supplyList"></ul>
      </section>
      <section class="card">
        <h2 class="eyebrow"><span class="ico" data-ico="broom"></span><span data-i18n="cleanup"></span></h2>
        <p class="lead" data-i18n="cleanupLead"></p>
        <ul class="rows" id="cleanupList"></ul>
      </section>
    </section>

    <!-- ④ 연락처 · 오시는 길 -->
    <section class="view" id="v-contact" data-view="contact" hidden>
      <a class="callcard cc-em" id="emBtn">
        <span class="cc-k"><span class="ico" data-ico="medical"></span><span data-i18n="emergency"></span></span>
        <span class="cc-who" id="emWho"></span>
        <span class="cc-tel"><span class="ico" data-ico="phone"></span><span id="emTel"></span></span>
        <span class="cc-note" id="emNote"></span>
      </a>
      <a class="callcard" id="inqBtn">
        <span class="cc-k"><span class="ico" data-ico="chat"></span><span id="inqNote"></span></span>
        <span class="cc-who" id="inqWho"></span>
        <span class="cc-tel"><span class="ico" data-ico="phone"></span><span id="inqTel"></span></span>
      </a>
      <section class="card">
        <h2 class="eyebrow"><span class="ico" data-ico="people"></span><span data-i18n="depts"></span></h2>
        <ul class="depts" id="deptList"></ul>
      </section>
      <section class="card">
        <h2 class="eyebrow"><span class="ico" data-ico="pin"></span><span data-i18n="venue"></span></h2>
        <p class="venue-name" id="venueName"></p>
        <p class="venue-addr" id="venueAddr"></p>
        <p class="note" id="venueBldg"></p>
        <a class="big-btn" id="mapBtn" target="_blank" rel="noopener"><span class="ico" data-ico="map"></span><span data-i18n="openMap"></span></a>
      </section>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <button type="button" class="install-btn" id="installBtn" hidden>
        <span class="ico" data-ico="phoneDl"></span>
        <span class="install-txt"><b data-i18n="installTitle"></b><small data-i18n="installSub"></small></span>
      </button>
      <div class="foot-actions">
        <button type="button" class="btn" id="shareBtn"><span class="ico" data-ico="share"></span><span data-i18n="share"></span></button>
        <button type="button" class="btn" id="qrBtn"><span class="ico" data-ico="qr"></span><span data-i18n="qr"></span></button>
      </div>
      <p class="foot-meta" id="footMeta"></p>
    </div>
  </footer>

  <nav class="bottomnav" id="bottomnav" aria-label="Menu"></nav>

  <dialog id="qrDialog">
    <div class="qr-box">
      <p class="qr-title" data-i18n="qrTitle"></p>
      <div id="qrCode"></div>
      <p class="qr-url" id="qrUrl"></p>
      <button type="button" class="btn" id="qrClose" data-i18n="close"></button>
    </div>
  </dialog>

  <dialog id="installDialog">
    <div class="ins-box">
      <p class="ins-title" id="insTitle"></p>
      <ol class="ins-steps" id="insSteps"></ol>
      <button type="button" class="btn primary" id="insClose" data-i18n="ok"></button>
    </div>
  </dialog>

  <dialog id="videoDialog" class="video-dlg">
    <div class="vd-head">
      <b data-i18n="videoTitle"></b>
      <button type="button" class="btn" id="videoClose" data-i18n="close"></button>
    </div>
    <div class="vd-frame"><iframe id="videoFrame" title="Promo video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <p class="vd-foot"><a id="videoOpen" target="_blank" rel="noopener"><span data-i18n="videoOpen"></span> ›</a></p>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <canvas id="snow" aria-hidden="true"></canvas>
  <script src="app.js"></script>
  <script src="snow.js"></script>
</body>
</html>
