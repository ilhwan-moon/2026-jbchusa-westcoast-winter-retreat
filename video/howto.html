<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>수련회 앱 사용법 영상</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Noto+Sans+SC:wght@500;700;900&family=Noto+Serif+KR:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Noto Sans KR', 'Noto Sans SC', -apple-system, sans-serif; }
  html[lang="zh"] body { font-family: 'Noto Sans SC', 'Noto Sans KR', sans-serif; }
  body { background: linear-gradient(170deg, #1d3647 0%, #2b4c61 50%, #3c6278 100%); color: #fff; position: relative; }
  #bgsnow { position: absolute; inset: 0; }
  .glow { position: absolute; width: 1000px; height: 1000px; border-radius: 50%; background: radial-gradient(circle, rgba(255,236,200,.16), transparent 65%); left: 40px; top: 520px; }

  /* 위 자막 */
  #cap { position: absolute; left: 0; right: 0; top: 60px; height: 290px; text-align: center; padding: 0 50px; z-index: 5; }
  #step { display: inline-block; padding: 8px 28px; border-radius: 999px; background: #f2d38f; color: #3b2a05; font-weight: 900; font-size: 36px; }
  #title { margin-top: 18px; font-size: 66px; font-weight: 900; line-height: 1.18; letter-spacing: -1px; text-shadow: 0 4px 18px rgba(0,0,0,.3); }
  #sub { margin-top: 12px; font-size: 38px; font-weight: 500; color: #dbe8ef; line-height: 1.35; }

  /* 휴대폰 */
  #phone { position: absolute; left: 190px; top: 380px; width: 700px; height: 1445px; border-radius: 92px; background: #0e1417; padding: 30px; box-shadow: 0 40px 90px rgba(0,0,0,.5), inset 0 0 0 3px #2a3439; z-index: 4; }
  #screen { position: relative; width: 640px; height: 1385px; border-radius: 64px; overflow: hidden; background: #f5f0e8; }
  .shot { position: absolute; left: 0; top: 88px; width: 640px; }
  #status { position: absolute; left: 0; right: 0; top: 0; height: 88px; z-index: 45; display: flex; justify-content: space-between; align-items: center; padding: 10px 56px 0 64px; font-weight: 700; font-size: 30px; color: #111; background: #fffdf9; }
  #status.dark { color: #fff; background: transparent; }
  #status .bat { display: inline-block; width: 46px; height: 22px; border: 3px solid currentColor; border-radius: 7px; position: relative; margin-left: 10px; vertical-align: middle; }
  #status .bat::after { content: ""; position: absolute; left: 2px; top: 2px; bottom: 2px; width: 70%; background: currentColor; border-radius: 3px; }
  #status .notch { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 200px; height: 56px; border-radius: 30px; background: #0e1417; }
  .layer { position: absolute; inset: 0; z-index: 10; opacity: 0; }

  /* 사파리 아래 막대 (iOS 26) */
  .sbar { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; background: linear-gradient(transparent, rgba(245,240,232,.95) 30%); display: flex; align-items: center; gap: 16px; padding: 0 34px 46px; }
  .circ { flex: none; width: 82px; height: 82px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 3px 12px rgba(0,0,0,.18); display: grid; place-items: center; }
  .pill { flex: 1; height: 82px; border-radius: 41px; background: rgba(255,255,255,.92); box-shadow: 0 3px 12px rgba(0,0,0,.18); display: flex; align-items: center; gap: 10px; padding: 0 20px; color: #333; font-size: 25px; }
  .pill .ut { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; }
  svg.i { width: 42px; height: 42px; fill: none; stroke: #222; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .tgt { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 14px; }

  /* 사파리 페이지 메뉴 */
  #smenu { background: rgba(0,0,0,.18); }
  #smenu .menu { position: absolute; left: 90px; bottom: 190px; width: 470px; border-radius: 44px; background: rgba(236,236,240,.98); box-shadow: 0 20px 50px rgba(0,0,0,.3); padding: 14px 0; }
  .mrow { display: flex; align-items: center; gap: 22px; height: 88px; padding: 0 34px; font-size: 32px; color: #111; }
  .mrow svg { width: 38px; height: 38px; fill: none; stroke: #222; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .mrow.sep { border-top: 2px solid #d4d4da; }

  /* 공유 시트 (어두운 iOS) */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 120px; border-radius: 50px 50px 0 0; background: #1c1c1e; color: #fff; padding: 0 28px; overflow: hidden; }
  .sh-head { display: flex; align-items: center; gap: 22px; padding: 34px 6px 24px; border-bottom: 1px solid #333; }
  .sh-head img { width: 96px; height: 96px; border-radius: 20px; object-fit: cover; }
  .sh-head b { display: block; font-size: 30px; white-space: nowrap; overflow: hidden; max-width: 380px; }
  .sh-head span { font-size: 26px; color: #9a9aa0; }
  .sh-x { margin-left: auto; width: 64px; height: 64px; border-radius: 50%; background: #3a3a3c; display: grid; place-items: center; font-size: 30px; }
  .apps { display: flex; gap: 30px; padding: 28px 8px 20px; border-bottom: 1px solid #333; }
  .apps div { width: 104px; text-align: center; font-size: 22px; color: #ddd; }
  .apps i { display: block; width: 104px; height: 104px; border-radius: 26px; margin-bottom: 10px; font-style: normal; font-size: 52px; line-height: 104px; }
  .acts { display: flex; gap: 30px; padding: 24px 8px 18px; }
  .acts div { width: 104px; text-align: center; font-size: 21px; color: #ddd; line-height: 1.25; }
  .acts i { display: grid; place-items: center; width: 104px; height: 104px; border-radius: 50%; background: #2c2c2e; margin-bottom: 10px; font-style: normal; font-size: 40px; }
  .grp { margin-top: 18px; border-radius: 30px; background: #2c2c2e; overflow: hidden; }
  .grp div { display: flex; align-items: center; gap: 22px; height: 86px; padding: 0 28px; font-size: 31px; border-top: 1px solid #3a3a3c; }
  .grp div:first-child { border-top: 0; }
  .grp div span.g { width: 40px; text-align: center; font-size: 32px; color: #ddd; }
  .grp div.hl { background: #4a4a4e; font-weight: 700; }

  /* 홈 화면에 추가 확인 창 */
  #confirm { background: #1c1c1e; color: #fff; }
  #confirm .top { position: absolute; left: 0; right: 0; top: 110px; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; font-size: 32px; }
  #confirm .top .c { width: 76px; height: 76px; border-radius: 50%; background: #3a3a3c; display: grid; place-items: center; font-size: 30px; }
  #confirm .top b { font-size: 34px; }
  #confirm .top .add { padding: 0 30px; height: 76px; border-radius: 38px; background: #0a84ff; display: grid; place-items: center; font-weight: 700; }
  #confirm .card { position: absolute; left: 30px; right: 30px; top: 240px; border-radius: 30px; background: #2c2c2e; padding: 30px; display: flex; gap: 26px; align-items: center; }
  #confirm .card img { width: 130px; height: 130px; border-radius: 30px; }
  #confirm .card .nm { font-size: 34px; border-bottom: 1px solid #48484a; padding-bottom: 14px; }
  #confirm .card .url { font-size: 26px; color: #9a9aa0; margin-top: 14px; }
  #confirm .tog { position: absolute; left: 30px; right: 30px; top: 470px; border-radius: 30px; background: #2c2c2e; padding: 0 30px; height: 100px; display: flex; align-items: center; justify-content: space-between; font-size: 32px; }
  .sw { width: 100px; height: 60px; border-radius: 30px; background: #30d158; position: relative; }
  .sw::after { content: ""; position: absolute; right: 4px; top: 4px; width: 52px; height: 52px; border-radius: 50%; background: #fff; }
  #confirm .note { position: absolute; left: 50px; right: 50px; top: 600px; font-size: 26px; color: #9a9aa0; line-height: 1.4; }

  /* 아이폰 크롬 (위 주소창 + 아래 도구) */
  .ctop { position: absolute; left: 0; right: 0; top: 88px; height: 95px; background: #f5f0e8; display: flex; align-items: center; padding: 0 22px; }
  .ctop .u { flex: 1; height: 74px; border-radius: 37px; background: #e3ddd3; display: flex; align-items: center; padding: 0 16px 0 24px; gap: 12px; color: #333; font-size: 28px; }
  .ctop .u .ut { flex: 1; text-align: center; }
  .cbot { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: #f5f0e8; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 22px; font-size: 40px; color: #444; }
  .cbot .plus { width: 76px; height: 76px; border-radius: 50%; background: #ddd6cb; display: grid; place-items: center; margin-top: -8px; }
  .cbot .tabs { width: 52px; height: 52px; border: 4px solid #444; border-radius: 12px; display: grid; place-items: center; font-size: 24px; font-weight: 800; }

  /* 안드로이드 */
  .atop { position: absolute; left: 0; right: 0; top: 88px; height: 100px; background: #f1f3f4; display: flex; align-items: center; gap: 14px; padding: 0 20px; }
  .atop .u { flex: 1; height: 70px; border-radius: 35px; background: #fff; display: flex; align-items: center; padding: 0 26px; font-size: 26px; color: #333; }
  .atop .dots { width: 60px; height: 70px; display: grid; place-items: center; font-size: 46px; font-weight: 900; color: #333; }
  #amenu .menu { position: absolute; right: 16px; top: 180px; width: 470px; background: #fff; border-radius: 26px; box-shadow: 0 16px 40px rgba(0,0,0,.3); padding: 12px 0; color: #1b1b1b; }
  #amenu .row { height: 90px; display: flex; align-items: center; padding: 0 34px; font-size: 31px; }
  #amenu .row.hl { background: #e8f0fe; font-weight: 800; color: #0b57d0; }
  #android { background: rgba(0,0,0,.45); }
  #android .card { position: absolute; left: 50px; right: 50px; top: 460px; background: #fff; border-radius: 40px; padding: 44px 40px 30px; color: #1b1b1b; }
  #android .t { font-size: 40px; font-weight: 700; }
  #android .app { display: flex; align-items: center; gap: 24px; margin: 34px 0 40px; }
  #android .app img { width: 100px; height: 100px; border-radius: 24px; }
  #android .app b { font-size: 32px; } #android .app span { display: block; font-size: 24px; color: #666; }
  #android .btns { display: flex; justify-content: flex-end; gap: 46px; font-size: 32px; font-weight: 700; color: #0b57d0; }
  #android .btns .ins { padding: 14px 34px; border-radius: 40px; background: #0b57d0; color: #fff; }

  /* 카톡 안 브라우저 아래 막대 */
  .kbar { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; background: #f7f7f7; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 30px; font-size: 44px; color: #888; }

  /* 홈 화면 */
  #home { background: linear-gradient(160deg, #5d7b93, #a7b9c6 55%, #e6d8c8); }
  #home .grid { position: absolute; left: 44px; right: 44px; top: 150px; display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 46px; }
  #home .app { text-align: center; font-size: 22px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  #home .app i { display: block; margin: 0 auto 10px; width: 120px; height: 120px; border-radius: 28px; font-style: normal; font-size: 64px; line-height: 120px; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
  #home .app img { display: block; margin: 0 auto 10px; width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 4px 10px rgba(0,0,0,.25); }
  #home .app .nm { display: block; width: 140px; margin: 0 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #home .dock { position: absolute; left: 30px; right: 30px; bottom: 30px; height: 170px; border-radius: 56px; background: rgba(255,255,255,.3); display: flex; justify-content: space-around; align-items: center; }
  #home .dock i { width: 120px; height: 120px; border-radius: 28px; font-style: normal; font-size: 64px; line-height: 120px; text-align: center; }

  /* 탭 표시 */
  #tap { position: absolute; z-index: 60; width: 0; height: 0; opacity: 0; }
  #tap .ring { position: absolute; left: -62px; top: -62px; width: 124px; height: 124px; border-radius: 50%; border: 8px solid #ffb703; background: rgba(255,183,3,.25); }
  #tap .dot { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,183,3,.95); box-shadow: 0 0 0 6px rgba(255,255,255,.75); }
  #tap .label { position: absolute; left: 54px; top: -92px; white-space: nowrap; padding: 8px 20px; border-radius: 14px; background: #ffb703; color: #2b1d00; font-weight: 900; font-size: 34px; box-shadow: 0 6px 16px rgba(0,0,0,.3); }
  #tap.left .label { left: auto; right: 54px; }
  #tap.below .label { top: 60px; }

  /* 카드 장면 */
  #card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 70px; opacity: 0; z-index: 6; }
  #card .big { font-size: 92px; font-weight: 900; line-height: 1.15; letter-spacing: -1.5px; text-shadow: 0 6px 24px rgba(0,0,0,.35); }
  #card .mid { margin-top: 28px; font-size: 42px; color: #dbe8ef; line-height: 1.35; }
  #card .art { width: 760px; border-radius: 36px; box-shadow: 0 30px 70px rgba(0,0,0,.4); margin-bottom: 50px; }
  #card .script { font-family: 'Great Vibes', cursive; font-size: 86px; color: #f2d38f; margin-top: 10px; }
  #card .appicon { width: 220px; height: 220px; border-radius: 52px; box-shadow: 0 20px 50px rgba(0,0,0,.4); margin-bottom: 40px; }
  .split { display: grid; gap: 22px; width: 100%; margin-top: 46px; text-align: left; }
  .split > div { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.2); border-radius: 30px; padding: 22px 32px; }
  .split h3 { margin: 0 0 8px; font-size: 44px; color: #f2d38f; }
  .split ol { margin: 0; padding-left: 0; list-style: none; font-size: 36px; line-height: 1.5; display: flex; flex-wrap: wrap; gap: 0 14px; }
  .split li + li::before { content: "→ "; color: #f2d38f; }
  #card .qr { width: 380px; height: 380px; background: #fff; padding: 22px; border-radius: 30px; }
  #card .link { margin-top: 26px; font-size: 34px; color: #f2d38f; font-weight: 700; }
  #card .feat { margin-top: 50px; font-size: 52px; font-weight: 900; line-height: 1.5; }
  #foot { position: absolute; left: 0; right: 0; bottom: 36px; text-align: center; font-size: 28px; color: rgba(255,255,255,.6); z-index: 5; }
</style>
<script src="assets/boxes.js"></script>
</head>
<body>
<canvas id="bgsnow" width="1080" height="1920"></canvas>
<div class="glow"></div>
<div id="cap"><div id="step"></div><div id="title"></div><div id="sub"></div></div>
<div id="card"></div>

<div id="phone"><div id="screen">
  <img class="shot" id="imgA" alt=""><img class="shot" id="imgB" alt="">
  <div id="status"><span>9:25</span><span class="notch"></span><span>▮▮▮ <span class="bat"></span></span></div>

  <!-- 사파리 -->
  <div class="layer" id="safari"><div class="sbar">
    <div class="circ"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="pill"><span class="tgt" id="sfMenu"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="6.5" height="6.5" rx="1.2"/><path d="M13 6h8M13 9.5h8M3 14.5h18M3 19h12"/></svg></span><span class="ut">ilhwan-moon.github.io</span><svg class="i" viewBox="0 0 24 24" style="width:34px"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg></div>
    <div class="circ"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="13" height="13" rx="2.5"/><path d="M4 15V6a2 2 0 0 1 2-2h9"/></svg></div>
  </div></div>
  <div class="layer" id="smenu"><div class="menu" id="smenuBox"></div></div>
  <div class="layer" id="sheet"><div class="sheet" id="sheetBox"></div></div>
  <div class="layer" id="confirm">
    <div class="top"><span class="c">✕</span><b id="cfTitle"></b><span class="add" id="cfAdd"></span></div>
    <div class="card"><img src="assets/icon.png" alt=""><div style="flex:1"><div class="nm">2026 Winter Retreat</div><div class="url">ilhwan-moon.github.io</div></div></div>
    <div class="tog"><span id="cfWeb"></span><span class="sw"></span></div>
    <div class="note" id="cfNote"></div>
  </div>

  <!-- 아이폰 크롬 -->
  <div class="layer" id="chrome">
    <div class="ctop"><div class="u"><span style="font-size:30px">✦</span><span class="ut">ⓘ ilhwan-moon.github.io</span><span class="tgt" id="chShare"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M7 10H5.5v10.5h13V10H17"/></svg></span></div></div>
    <div class="cbot"><span>←</span><span>→</span><span class="plus">+</span><span class="tabs">3</span><span>•••</span></div>
  </div>
  <div class="layer" id="chsheet"><div class="sheet" id="chsheetBox"></div></div>

  <!-- 안드로이드 -->
  <div class="layer" id="atopL"><div class="atop"><div class="u">ilhwan-moon.github.io</div><div class="dots" id="aDots">⋮</div></div></div>
  <div class="layer" id="amenu"><div class="atop"><div class="u">ilhwan-moon.github.io</div><div class="dots">⋮</div></div><div class="menu" id="amenuBox"></div></div>
  <div class="layer" id="android"><div class="card"><div class="t" id="anTitle"></div><div class="app"><img src="assets/icon.png" alt=""><div><b>2026 Winter Retreat</b><span>ilhwan-moon.github.io</span></div></div><div class="btns"><span id="anCancel"></span><span class="ins" id="anInstall"></span></div></div></div>

  <div class="layer" id="kakao"><div class="kbar"><span>‹</span><span>›</span><span>⟳</span><span>⤴</span><span>⋯</span></div></div>

  <!-- 홈 화면 -->
  <div class="layer" id="home"><div class="grid" id="homeGrid"></div><div class="dock"><i style="background:#34c759">📞</i><i style="background:#1e90ff">🧭</i><i style="background:#34c759">💬</i><i style="background:#ff9f0a">🎵</i></div></div>

  <div id="tap"><div class="ring"></div><div class="dot"></div><div class="label" id="tapLabel"></div></div>
</div></div>
<div id="foot">2026 West Coast Winter Retreat · Jesus Baptist U.S.A. Conference</div>

<script>
const LANG = new URLSearchParams(location.search).get('lang') || 'ko';
document.documentElement.lang = LANG;
const K = 640 / 390;                       // CSS px → 화면 px
const TOP = { app: 88, safari: 88, chrome: 183, install: 88, table: 88, settings: 88, big: 88 };
const B = window.BOXES[LANG];
const $ = (id) => document.getElementById(id);
const bx = (shot, key) => ({ x: B[shot][key].x * K, y: B[shot][key].y * K + TOP[shot] });

const TX = {
 ko: {
  mock: {
   smenu: ['번역', '공유', '북마크 추가', '페이지에서 찾기', '페이지 확대/축소'],
   sapps: ['AirDrop', '메시지', '메일', '메모'], sacts: ['복사', '북마크 추가', '읽기 목록에 추가', '더 보기'],
   slist: ['즐겨찾기에 추가', '빠른 메모에 추가', '페이지에서 찾기', '홈 화면에 추가'],
   cacts: ['복사', '내 기기로 보내기', '읽기 목록에 추가', '더 보기'],
   clist: ['북마크에 추가', 'QR 코드 만들기', '페이지에서 찾기', '데스크톱 사이트 요청', '인쇄'], cadd: ['홈 화면에 추가', '빠른 메모에 추가'],
   cf: ['홈 화면에 추가', '추가', '웹 앱으로 열기', '홈 화면에 아이콘이 추가되어 이 웹사이트에 빠르게 접근할 수 있습니다.'],
   amenu: ['새 탭', '방문 기록', '북마크', '홈 화면에 추가', '설정'], an: ['앱 설치', '취소', '설치'],
   home: ['전화', '메시지', '카메라', '캘린더', '사진', '시계', '날씨'] },
  cards: {

  title: `<img class="art" src="assets/hero.jpg"><div class="big">${TX.cards.title[0]}</div><div class="script">Imitating Jesus Christ</div><div class="mid">${TX.cards.title[1]}</div>`,
  core: `<img class="appicon" src="assets/icon.png"><div class="big">${TX.cards.core[0]}</div><div class="mid">${TX.cards.core[1]}</div>`,
  split: `<div class="big" style="font-size:80px">${sp[0]}</div><div class="split">${sp[1].map((c) => `<div><h3>${c[0]}</h3><ol>${c[1].map((x) => `<li>${x}</li>`).join('')}</ol></div>`).join('')}</div>`,
  end: `<img class="qr" src="assets/qr_${LANG}.png"><div class="link">ilhwan-moon.github.io/2026-jbchusa-westcoast-winter-retreat</div><div class="feat"><div>${TX.cards.end[0]}</div><div>${TX.cards.end[1]}</div></div>`,
};

// ── 배경 눈 (시간으로 정해지는 위치) ──
const FL = Array.from({ length: 46 }, (_, i) => { const r = (k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); }; return { x: r(1) * 1080, y0: r(2) * 1920, v: 40 + r(3) * 70, s: 7 + r(4) * 12, ph: r(5) * 6.28, rot: r(6) * 6.28, a: .25 + r(7) * .45 }; });
function snow(t) {
  const c = $('bgsnow').getContext('2d'); c.clearRect(0, 0, 1080, 1920); c.lineCap = 'round';
  FL.forEach((f) => {
    const y = (f.y0 + f.v * t) % 2000 - 40, x = f.x + Math.sin(f.ph + t * .7) * 30, r = f.s;
    c.save(); c.translate(x, y); c.rotate(f.rot + t * .3); c.strokeStyle = `rgba(255,255,255,${f.a})`; c.lineWidth = Math.max(1.5, r / 6); c.beginPath();
    for (let k = 0; k < 6; k++) { c.moveTo(0, 0); c.lineTo(0, -r); c.moveTo(0, -r * .55); c.lineTo(-r * .28, -r * .78); c.moveTo(0, -r * .55); c.lineTo(r * .28, -r * .78); c.rotate(Math.PI / 3); }
    c.stroke(); c.restore();
  });
}

function posOf(sel) { const s = $('screen').getBoundingClientRect(), r = document.querySelector(sel).getBoundingClientRect(); return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 }; }
const ease = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };

function render(t) {
  snow(t);
  let i = 0, t0 = 0; while (i < S.length - 1 && t >= t0 + S[i].d) { t0 += S[i].d; i++; }
  const s = S[i], lt = t - t0;
  const fadeIn = ease(lt / 0.4), fadeOut = 1 - ease((lt - (s.d - 0.3)) / 0.3), vis = Math.min(fadeIn, fadeOut);
  $('step').textContent = s.step || ''; $('step').style.display = s.step ? '' : 'none';
  $('title').textContent = s.title || ''; $('sub').textContent = s.sub || '';
  $('cap').style.opacity = s.card ? 0 : vis; $('cap').style.transform = `translateY(${(1 - fadeIn) * 20}px)`;
  $('phone').style.opacity = s.card ? 0 : 1;
  $('card').style.opacity = s.card ? vis : 0; $('card').style.transform = `scale(${0.96 + 0.04 * fadeIn})`;
  if (s.card) { if ($('card').dataset.k !== s.card) { $('card').innerHTML = CARDS[s.card]; $('card').dataset.k = s.card; } return; }

  // 화면 이미지
  const seq = [[0, s.img]]; if (s.img2) seq.push([s.img2[1], s.img2[0]]);
  let cur = seq[0], nxt = null, mix = 0;
  for (const q of seq) if (lt >= q[0]) cur = q;
  const ci = seq.indexOf(cur);
  if (ci > 0 && lt - cur[0] < 0.35) { nxt = cur; cur = seq[ci - 1]; mix = ease((lt - nxt[0]) / 0.35); }
  const A = $('imgA'), Bm = $('imgB'), src = (n) => 'assets/' + IMG(n) + '.png';
  const topOf = (n) => (s.imgTop && n === s.img ? s.imgTop : TOP[n]) + 'px';
  if (cur[1]) { if (A.getAttribute('src') !== src(cur[1])) A.setAttribute('src', src(cur[1])); A.style.opacity = 1; A.style.top = topOf(cur[1]); } else A.style.opacity = 0;
  if (nxt) { if (Bm.getAttribute('src') !== src(nxt[1])) Bm.setAttribute('src', src(nxt[1])); Bm.style.opacity = mix; Bm.style.top = topOf(nxt[1]); } else Bm.style.opacity = 0;
  const pan = s.pan ? s.pan[0] + (s.pan[1] - s.pan[0]) * ease(lt / s.d) : 0;
  A.style.transform = Bm.style.transform = `translateY(${pan}px)`;

  // 상태 표시줄 (어두운 화면에서는 흰 글씨)
  const dk = s.dark === true || (Array.isArray(s.dark) && lt >= s.dark[0] && lt < s.dark[1]);
  $('status').classList.toggle('dark', !!dk);

  // 모형 화면
  ['safari', 'smenu', 'sheet', 'confirm', 'chrome', 'chsheet', 'atopL', 'amenu', 'android', 'kakao', 'home'].forEach((id) => {
    const r = s.layers && s.layers[id]; let o = 0;
    if (r) o = (r[0] === 0 && (id === 'safari' || id === 'chrome' || id === 'kakao') ? 1 : ease((lt - r[0]) / 0.35)) * (1 - ease((lt - r[1]) / 0.35));
    $(id).style.opacity = o;
    const panel = $(id).querySelector('.sheet, .menu, .card');
    if (panel && (id === 'sheet' || id === 'chsheet' || id === 'smenu' || id === 'android' || id === 'amenu')) panel.style.transform = `translateY(${(1 - ease((lt - (r ? r[0] : 0)) / 0.45)) * 140}px)`;
  });
  if (s.sheetScroll) { const [a, b, t1, t2] = s.sheetScroll; const y = a + (b - a) * ease((lt - t1) / (t2 - t1)); $('chsheetBox').style.transform = `translateY(0)`; $('chsheetBox').scrollTop = 0; Array.from($('chsheetBox').children).forEach((c) => { c.style.transform = `translateY(${y}px)`; }); }
  else Array.from($('chsheetBox').children).forEach((c) => { c.style.transform = ''; });
  // 누를 칸 강조
  document.querySelectorAll('.hl').forEach((e) => e.classList.remove('hl'));
  if (s.tap && typeof s.tap[1] === 'string' && lt >= s.tap[0] - 0.6) { const e = document.querySelector(s.tap[1]); if (e && /shAdd|chAdd|aAdd/.test(s.tap[1])) e.classList.add('hl'); }

  // 탭 표시
  const tp = $('tap');
  if (s.tap) {
    const [ta, p0, label, where] = s.tap;
    const pos = typeof p0 === 'string' ? posOf(p0) : p0();
    tp.classList.toggle('left', pos.x > 330); tp.classList.toggle('below', where === 'below');
    const a = lt - (ta - 0.9);
    tp.style.left = pos.x + 'px'; tp.style.top = pos.y + 'px'; $('tapLabel').textContent = label;
    const appear = ease(a / 0.3), gone = 1 - ease((lt - ta - 0.8) / 0.3);
    tp.style.opacity = Math.max(0, Math.min(appear, gone));
    const pulse = lt < ta ? 1 + 0.12 * Math.sin(a * 9) : 1 + 0.9 * ease((lt - ta) / 0.5);
    tp.querySelector('.ring').style.transform = `scale(${pulse})`;
    tp.querySelector('.ring').style.opacity = lt < ta ? 1 : 1 - ease((lt - ta) / 0.6);
    tp.querySelector('.dot').style.transform = `scale(${lt >= ta && lt < ta + 0.25 ? 0.8 : 1})`;
  } else tp.style.opacity = 0;
}
window.render = render; window.TOTAL = TOTAL; window.SCENES = S.map((s) => s.d);
render(0);
</script>
</body>
</html>
